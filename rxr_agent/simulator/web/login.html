<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; RxR Multilingual VLN Decision Agent</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Ambient glow backgrounds */
    .glow-cyan {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, rgba(6, 182, 212, 0) 70%);
      top: -120px;
      left: -120px;
      pointer-events: none;
      filter: blur(40px);
    }
    .glow-purple {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.10) 0%, rgba(139, 92, 246, 0) 70%);
      bottom: -150px;
      right: -150px;
      pointer-events: none;
      filter: blur(50px);
    }
    .grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-[#070a10] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden grid-pattern">

  <!-- Ambient background glow elements -->
  <div class="glow-cyan"></div>
  <div class="glow-purple"></div>

  <!-- Center Card -->
  <div class="w-full max-w-md relative z-10">
    <div class="glass-card p-8 backdrop-blur-xl bg-[#0e1422]/90 border border-slate-800/80 shadow-2xl rounded-2xl relative">
      
      <!-- Top Brand Header -->
      <div class="flex flex-col items-center text-center mb-7">
        <!-- Minimalist Radar / Compass Emblem -->
        <div class="w-13 h-13 p-3.5 mb-3 rounded-2xl bg-gradient-to-br from-cyan-950/80 to-slate-900 border border-cyan-500/30 shadow-lg shadow-cyan-950/50 flex items-center justify-center relative group">
          <svg class="w-7 h-7 text-cyan-400 transform transition-transform group-hover:rotate-45 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 0v20m10-10H2m13.5-3.5L12 12m0 0L8.5 15.5m3.5-3.5l3.5 3.5m-3.5-3.5L8.5 8.5"/>
          </svg>
          <span class="absolute -top-1 -right-1 flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-cyan-500"></span>
          </span>
        </div>

        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          RxR Navigation Terminal
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Multilingual Vision-and-Language Decision Agent
        </p>

        <!-- Supported Languages Chips -->
        <div class="flex items-center gap-1.5 mt-3 text-[10px] text-slate-400 font-mono">
          <span class="px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-cyan-400 font-semibold">EN</span>
          <span>&bull;</span>
          <span class="px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-amber-400 font-semibold">हिंदी</span>
          <span>&bull;</span>
          <span class="px-2 py-0.5 rounded-full bg-slate-900 border border-slate-800 text-purple-400 font-semibold">తెలుగు</span>
        </div>
      </div>

      <!-- Alert Box (Hidden by default) -->
      <div id="auth-alert" class="hidden mb-5 p-3 rounded-xl bg-rose-950/60 border border-rose-800/80 text-xs text-rose-200 flex items-center gap-2.5">
        <svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="auth-alert-msg">Invalid credentials. Please verify your details.</span>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <!-- Username / Email -->
        <div>
          <label for="username" class="block text-xs font-medium text-slate-300 mb-1.5 flex items-center justify-between">
            <span>Username or Researcher ID</span>
            <span class="text-[10px] text-slate-500 font-mono">Required</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
            <input 
              type="text" 
              id="username" 
              name="username" 
              required 
              placeholder="e.g. researcher" 
              class="w-full pl-9 pr-3.5 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
              autocomplete="username"
            />
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-xs font-medium text-slate-300">Access Key</label>
            <button type="button" onclick="fillDemoCredentials()" class="text-[11px] text-cyan-400 hover:text-cyan-300 transition">
              Use Demo Key
            </button>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </div>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" 
              class="w-full pl-9 pr-10 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
              autocomplete="current-password"
            />
            <button 
              type="button" 
              onclick="togglePassword()" 
              class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 transition focus:outline-none"
              title="Toggle visibility"
            >
              <svg id="eye-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input 
              type="checkbox" 
              id="remember-me" 
              checked 
              class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-cyan-500 focus:ring-cyan-500/20 focus:ring-offset-0 focus:ring-offset-slate-900 cursor-pointer"
            />
            <span class="text-xs text-slate-400">Keep session active</span>
          </label>
          <span class="text-[11px] text-slate-500 font-mono">v1.0-RxR</span>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="submit-btn" 
            class="w-full py-2.5 px-4 rounded-xl font-semibold text-sm text-white bg-gradient-to-r from-cyan-600 via-cyan-500 to-blue-600 hover:from-cyan-500 hover:to-blue-500 active:scale-[0.99] transition-all shadow-lg shadow-cyan-900/30 flex items-center justify-center gap-2"
          >
            <span>Launch Navigation Terminal</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </div>
      </form>

      <!-- Minimal Divider -->
      <div class="relative my-5">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-800"></div>
        </div>
        <div class="relative flex justify-center text-[10px] uppercase font-mono tracking-wider">
          <span class="bg-[#0e1422] px-2 text-slate-500">Instant Access</span>
        </div>
      </div>

      <!-- Quick One-Click Guest Access -->
      <button 
        type="button" 
        onclick="loginAsGuest()" 
        class="w-full py-2.5 px-4 rounded-xl font-medium text-xs text-slate-300 bg-slate-900/80 hover:bg-slate-800/80 hover:text-white border border-slate-800 hover:border-slate-700 transition flex items-center justify-center gap-2"
      >
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span>Enter as Guest Researcher (One-Click)</span>
      </button>

      <!-- Footer Info -->
      <div class="mt-6 pt-4 border-t border-slate-800/60 text-center">
        <p class="text-[11px] text-slate-500 leading-relaxed">
          Google Research RxR Benchmark &bull; State-Space Agent &bull; Matterport3D
        </p>
      </div>

    </div>
  </div>

  <script>
    // Toggle Password Visibility
    function togglePassword() {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
      }
    }

    // Auto-fill demo credentials
    function fillDemoCredentials() {
      document.getElementById('username').value = 'researcher';
      document.getElementById('password').value = 'rxr-vln-2026';
      hideAlert();
    }

    function showAlert(msg) {
      const alertBox = document.getElementById('auth-alert');
      const alertMsg = document.getElementById('auth-alert-msg');
      alertMsg.textContent = msg;
      alertBox.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('auth-alert').classList.add('hidden');
    }

    // Sign in handler
    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();
      const user = document.getElementById('username').value.trim();
      const pwd = document.getElementById('password').value;
      const remember = document.getElementById('remember-me').checked;

      if (!user || !pwd) {
        showAlert('Please enter both your identifier and access key.');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Authenticating...</span>
      `;

      try {
        // Try backend verification if endpoint is present
        let authOk = true;
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pwd })
          });
          if (res.ok) {
            const data = await res.json();
            authOk = data.authenticated !== false;
          }
        } catch (_) {
          // If server offline or direct static file, allow client session
          authOk = true;
        }

        if (authOk) {
          const session = {
            username: user,
            role: user === 'guest' ? 'Guest Explorer' : 'Lead Researcher',
            loginTime: new Date().toISOString()
          };
          if (remember) {
            localStorage.setItem('rxr_session', JSON.stringify(session));
          } else {
            sessionStorage.setItem('rxr_session', JSON.stringify(session));
          }
          window.location.href = 'index.html';
        } else {
          showAlert('Invalid access key or username.');
          btn.disabled = false;
          btn.innerHTML = `
            <span>Launch Navigation Terminal</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          `;
        }
      } catch (err) {
        console.error(err);
        showAlert('Connection error. Continuing locally.');
        window.location.href = 'index.html';
      }
    }

    // One-click guest sign-in
    function loginAsGuest() {
      const guestSession = {
        username: 'Guest Researcher',
        role: 'Guest Explorer',
        loginTime: new Date().toISOString()
      };
      localStorage.setItem('rxr_session', JSON.stringify(guestSession));
      window.location.href = 'index.html';
    }

    // Auto-redirect if already authenticated
    (function checkExistingSession() {
      const existing = localStorage.getItem('rxr_session') || sessionStorage.getItem('rxr_session');
      if (existing) {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
          localStorage.removeItem('rxr_session');
          sessionStorage.removeItem('rxr_session');
        } else {
          window.location.href = 'index.html';
        }
      }
    })();
  </script>
</body>
</html>
